<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShantiView - Your Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .btn-gradient {
            background-image: linear-gradient(to right, #6EE7B7, #3B82F6, #9333EA);
            transition: transform 0.3s ease-in-out;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(147, 51, 234, 0.5);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <div class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

        <header class="flex items-center justify-center mb-12">
            <svg class="h-10 w-10 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21.5c-4.4 0-8-3.6-8-8 0-4.4 3.6-8 8-8s8 3.6 8 8c0 4.4-3.6 8-8 8z" />
                <path d="M12 10a2 2 0 100 4 2 2 0 000-4z" />
                <path d="M16 16l-1 1" />
                <path d="M8 16l1 1" />
                <path d="M16 8l1-1" />
                <path d="M8 8l-1-1" />
            </svg>
            <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 via-blue-500 to-purple-600 ml-4">
                ShantiView
            </h1>
        </header>

        <main class="text-center max-w-xl w-full p-8 bg-gray-800 rounded-3xl shadow-2xl">
            <h2 class="text-2xl md:text-3xl font-semibold mb-6 text-white">
                Let's Get Started 👋
            </h2>
            <p class="text-base md:text-lg mb-8 text-gray-400 leading-relaxed">
                Please provide your name and location to begin your wellness journey.
            </p>

            <form id="details-form" class="space-y-6 text-left" action="{{ url_for('submit_data') }}" method="POST">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-300 mb-2">Your Full Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required class="w-full px-4 py-3 rounded-xl bg-gray-700 border border-gray-600 text-white placeholder-gray-500 focus:outline-none input-glow transition-all duration-200">
                </div>

                <div class="relative">
                    <label for="city" class="block text-sm font-medium text-gray-300 mb-2">Select Your City</label>
                    <!-- New button for geolocation -->
                    <button type="button" id="get-location-btn" class="w-full btn-gradient px-4 py-3 rounded-xl text-lg font-bold text-white shadow-lg transition-transform mb-4">
                        <span id="btn-text">Get My Current Location</span>
                    </button>
                    <!-- City input field, now read-only -->
                    <input type="text" id="city" name="city" placeholder="Click the button above to get your city..." required class="w-full px-4 py-3 rounded-xl bg-gray-700 border border-gray-600 text-white placeholder-gray-500 focus:outline-none input-glow transition-all duration-200" readonly>
                </div>

                <div class="pt-4 text-center">
                    <button type="submit" class="w-full btn-gradient px-8 py-3 rounded-full text-lg font-bold text-white shadow-lg transition-transform">
                        Proceed
                    </button>
                </div>
            </form>
        </main>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const cityInput = document.getElementById('city');
            const getLocationBtn = document.getElementById('get-location-btn');
            const btnText = document.getElementById('btn-text');

            // Function to get city name from coordinates using a real-world API
            async function getCityFromCoordinates(latitude, longitude) {
                try {
                    // The Nominatim API is a free reverse geocoding service from OpenStreetMap.
                    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`;
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // Nominatim API response contains an 'address' object. We check for common location types.
                    const address = data.address;
                    if (address) {
                        return address.city || address.town || address.village || address.hamlet || 'Unknown City';
                    }
                    
                    return 'Unknown City';
                } catch (error) {
                    console.error("Failed to reverse geocode coordinates:", error);
                    return 'Unknown City';
                }
            }

            // Event listener for the "Get My Location" button
            getLocationBtn.addEventListener('click', () => {
                btnText.textContent = 'Fetching...';
                getLocationBtn.disabled = true;
                cityInput.placeholder = 'Fetching your location...';

                // Check if the browser supports geolocation
                if (navigator.geolocation) {
                    // Get the user's current position
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            const latitude = position.coords.latitude;
                            const longitude = position.coords.longitude;
                            console.log(`Latitude: ${latitude}, Longitude: ${longitude}`);
                            
                            // Call the conceptual function to get the city name
                            const cityName = await getCityFromCoordinates(latitude, longitude);
                            cityInput.value = cityName;
                            cityInput.placeholder = cityName;
                            
                            btnText.textContent = 'Location Found!';
                            getLocationBtn.disabled = false;
                        },
                        (error) => {
                            // Handle errors, e.g., user denied permission
                            console.error("Geolocation error:", error);
                            btnText.textContent = 'Get My Current Location';
                            getLocationBtn.disabled = false;
                            cityInput.placeholder = 'Unable to get location. Try again.';

                            let errorMessage = 'Unable to get your location. Please type it in.';
                            if (error.code === error.PERMISSION_DENIED) {
                                errorMessage = 'Location access was denied. Please allow it or type your city.';
                            } else if (error.code === error.POSITION_UNAVAILABLE) {
                                errorMessage = 'Location information is unavailable.';
                            } else if (error.code === error.TIMEOUT) {
                                errorMessage = 'The request to get user location timed out.';
                            }
                            
                            // You could display a message to the user here.
                            console.log(errorMessage);
                            alert(errorMessage);
                        }
                    );
                } else {
                    // Browser does not support geolocation
                    console.log("Geolocation is not supported by this browser.");
                    btnText.textContent = 'Get My Current Location';
                    getLocationBtn.disabled = false;
                    cityInput.placeholder = 'Browser not supported.';
                    alert("Geolocation is not supported by your browser.");
                }
            });
        });
    </script>

</body>
</html>
