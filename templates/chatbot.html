<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShantiView Chatbot</title>
    <!-- Use Inter font for a clean, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .btn-gradient {
            background-image: linear-gradient(to right, #6EE7B7, #3B82F6, #9333EA);
            transition: transform 0.3s ease-in-out;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(147, 51, 234, 0.5);
        }
        /* Custom scrollbar for the chat window */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: #1f2937; /* Gray-800 */
        }
        .chat-container::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* Gray-600 */
            border-radius: 4px;
            border: 2px solid #1f2937;
        }
        .message-bot {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 relative isolate">

    <!-- Background decorative blobs -->
    <div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-blue-500/20 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Container -->
    <div class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

        <!-- Header -->
        <header class="flex items-center justify-center mb-6 md:mb-8">
            <svg class="h-8 w-8 md:h-10 md:w-10 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21.5c-4.4 0-8-3.6-8-8 0-4.4 3.6-8 8-8s8 3.6 8 8c0 4.4-3.6 8-8 8z" />
                <path d="M12 10a2 2 0 100 4 2 2 0 000-4z" />
                <path d="M16 16l-1 1" />
                <path d="M8 16l1 1" />
                <path d="M16 8l1-1" />
                <path d="M8 8l-1-1" />
            </svg>
            <h1 class="text-2xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 via-blue-500 to-purple-600 ml-3">
                ShantiView Chat
            </h1>
        </header>

        <!-- Chat Section -->
        <main class="w-full max-w-2xl h-[70vh] flex flex-col p-6 bg-gray-800 rounded-3xl shadow-2xl relative">
            <!-- Back to Welcome Page Button -->
            <a href="{{ url_for('welcome') }}" class="absolute top-6 left-6 bg-gray-800/50 hover:bg-gray-700/70 backdrop-blur-sm text-gray-300 hover:text-white p-3 rounded-full shadow-lg transition-all duration-300 z-50" title="Back to Welcome Page">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>

            <!-- Chat Messages Container -->
            <div id="chat-container" class="chat-container flex-1 overflow-y-auto space-y-4 pr-2 pb-4 pt-16">
                <!-- Initial bot messages -->
                <div class="flex items-start">
                    <img src="https://placehold.co/40x40/6EE7B7/ffffff?text=AI" alt="Bot Icon" class="h-8 w-8 rounded-full mr-2 md:mr-4 flex-shrink-0">
                    <div class="bg-gray-700 text-gray-300 p-3 rounded-2xl rounded-tl-none max-w-[80%] md:max-w-[70%]">
                        <p class="text-sm md:text-base">Hello! I'm ShantiView, your personal wellness assistant. How can I help you today?</p>
                    </div>
                </div>
                <div class="flex items-start">
                    <img src="https://placehold.co/40x40/6EE7B7/ffffff?text=AI" alt="Bot Icon" class="h-8 w-8 rounded-full mr-2 md:mr-4 flex-shrink-0">
                    <div class="bg-gray-700 text-gray-300 p-3 rounded-2xl rounded-tl-none max-w-[80%] md:max-w-[70%]">
                        <p class="text-sm md:text-base">You can ask me about mindfulness exercises, relaxation techniques, or just talk about your day.</p>
                    </div>
                </div>
            </div>

            <!-- User Input Area -->
            <form id="chat-form" class="mt-4 flex gap-2 md:gap-4">
                <input type="text" id="user-input" placeholder="Type your message..." class="flex-1 px-4 py-3 rounded-full bg-gray-700 border border-gray-600 text-white placeholder-gray-500 focus:outline-none input-glow transition-all duration-200">
                <button type="submit" class="btn-gradient px-4 md:px-6 py-2 rounded-full text-sm md:text-base font-bold text-white shadow-lg transition-transform flex items-center justify-center">
                    Send
                </button>
            </form>
        </main>
    </div>

    <!-- JavaScript for Chat Functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatForm = document.getElementById('chat-form');
            const userInput = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');

            // Function to add a message to the chat
            function addMessage(sender, text) {
                const messageContainer = document.createElement('div');
                const textBubble = document.createElement('div');

                if (sender === 'user') {
                    messageContainer.className = 'flex justify-end';
                    textBubble.className = 'bg-blue-600 text-white p-3 rounded-2xl rounded-br-none max-w-[80%] md:max-w-[70%]';
                } else {
                    messageContainer.className = 'flex items-start message-bot';
                    const botIcon = document.createElement('img');
                    botIcon.src = 'https://placehold.co/40x40/6EE7B7/ffffff?text=AI';
                    botIcon.alt = 'Bot Icon';
                    botIcon.className = 'h-8 w-8 rounded-full mr-2 md:mr-4 flex-shrink-0';
                    messageContainer.appendChild(botIcon);
                    textBubble.className = 'bg-gray-700 text-gray-300 p-3 rounded-2xl rounded-tl-none max-w-[80%] md:max-w-[70%]';
                }

                textBubble.innerHTML = `<p class="text-sm md:text-base">${text}</p>`;
                messageContainer.appendChild(textBubble);
                chatContainer.appendChild(messageContainer);

                // Scroll to the bottom
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // Function to get a response from the Gemini model via our backend
            async function getBotResponse(userMessage) {
                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: userMessage }),
                    });

                    if (!response.ok) {
                        console.error('API Error:', await response.text());
                        return "I'm having a little trouble connecting right now. Please try again in a moment.";
                    }

                    const data = await response.json();
                    return data.response;

                } catch (error) {
                    console.error('Fetch Error:', error);
                    return "It seems there's a network issue. Please check your connection and try again.";
                }
            }

            // Handle form submission (sending a message)
            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const userMessage = userInput.value.trim();

                if (userMessage) {
                    addMessage('user', userMessage);
                    userInput.value = '';

                    // Add a temporary "typing" message from the bot
                    const botTypingMessage = document.createElement('div');
                    botTypingMessage.id = 'bot-typing-indicator';
                    botTypingMessage.className = 'flex items-center';
                    botTypingMessage.innerHTML = `
                        <img src="https://placehold.co/40x40/6EE7B7/ffffff?text=AI" alt="Bot Icon" class="h-8 w-8 rounded-full mr-2 md:mr-4 flex-shrink-0">
                        <div class="bg-gray-700 text-gray-300 p-3 rounded-2xl rounded-tl-none max-w-[80%] md:max-w-[70%]">
                            <div class="flex items-center space-x-1">
                                <span class="block w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay: -0.32s;"></span>
                                <span class="block w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay: -0.16s;"></span>
                                <span class="block w-2 h-2 rounded-full bg-gray-400 animate-bounce"></span>
                            </div>
                        </div>
                    `;
                    chatContainer.appendChild(botTypingMessage);
                    chatContainer.scrollTop = chatContainer.scrollHeight;

                    // Get and display the bot's response
                    const botResponse = await getBotResponse(userMessage);
                    
                    // Remove the typing indicator before adding the real message
                    chatContainer.removeChild(botTypingMessage);

                    addMessage('bot', botResponse);
                }
            });
        });
    </script>
</body>
</html>
